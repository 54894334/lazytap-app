name: build-app

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Theos + iOS SDK
        run: |
          brew install ldid xz || true
          export THEOS=$HOME/theos
          git clone --depth 1 --recursive https://github.com/theos/theos.git "$THEOS"
          mkdir -p "$THEOS/sdks"
          curl -fsSL -o /tmp/sdks.tar.gz https://github.com/theos/sdks/archive/refs/heads/master.tar.gz
          tar -xzf /tmp/sdks.tar.gz -C /tmp
          cp -R /tmp/sdks-master/*.sdk "$THEOS/sdks/" || true
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"

      - name: 编译 App
        run: |
          make clean || true
          make FINALPACKAGE=1

      - name: 组装 .app 并打 ipa / tipa
        run: |
          # Theos 的 application 产物在 .theos/obj/…/LazyTap.app；
          # 跑过 make package 才会额外落到 .theos/_/Applications。
          APP=""
          for c in ".theos/_/Applications/LazyTap.app" ".theos/obj/LazyTap.app" ".theos/obj/debug/LazyTap.app"; do
            if [ -d "$c" ]; then APP="$c"; break; fi
          done
          if [ -z "$APP" ]; then
            APP=$(find .theos -type d -name "LazyTap.app" | sort | head -n 1)
          fi
          if [ -z "$APP" ] || [ ! -f "$APP/LazyTap" ]; then
            echo "没找到 .app 或主二进制"; find .theos -maxdepth 4 -name "*.app" -print; exit 1
          fi
          echo "APP=$APP"
          file "$APP/LazyTap"
          lipo -info "$APP/LazyTap" || true

          # Info.plist 必须自己放进 .app：make（非 package）不会把它拷进 obj 里的 bundle
          cp LazyTap/Info.plist "$APP/Info.plist"
          plutil -lint "$APP/Info.plist"

          # 图标等资源
          cp LazyTap/*.png "$APP"/ 2>/dev/null || true

          # 保底重签：把 entitlements 明确写进主二进制（TrollStore 安装时会保留）
          ldid -Sentitlements.plist "$APP/LazyTap"
          echo "=== 二进制 entitlements ==="
          ldid -e "$APP/LazyTap" || true

          rm -rf Payload && mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry LazyTap.tipa Payload
          cp LazyTap.tipa LazyTap.ipa
          echo "=== 包内清单 ==="
          unzip -l LazyTap.tipa
          # 硬校验：没有 Info.plist 的 ipa 装不上
          unzip -l LazyTap.tipa | grep -q "Payload/LazyTap.app/Info.plist" || { echo "缺 Info.plist"; exit 1; }
          ls -la LazyTap.tipa LazyTap.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: LazyTap-ipa
          path: |
            LazyTap.tipa
            LazyTap.ipa

      - name: 回推产物到 dist 分支（免登录取货）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B dist
          git add -f LazyTap.tipa LazyTap.ipa
          git commit -m "build: LazyTap app ${GITHUB_SHA::7}" || echo "no change"
          git push -f origin dist
